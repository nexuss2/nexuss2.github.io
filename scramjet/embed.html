<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed</title>
    <link rel="stylesheet" href="styles/defaults.css">
    <link rel="icon" href="data:,">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%;overflow:hidden;background:#111;font-family:'Inter',system-ui,sans-serif}
        #iframe-container{width:100%;height:100%;position:absolute;top:0;left:0;transition:filter .5s ease;z-index:1;filter:blur(15px)}
        #iframe-container.loaded{filter:blur(0)}
        #embed-frame{width:100%;height:100%;border:none;background:transparent}
        .message-container{display:flex;align-items:center;justify-content:center;height:100%;width:100%;color:var(--text-color);text-align:center;position:fixed;top:0;left:0;z-index:10;background:rgba(10,10,10,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .3s ease,visibility .3s}
        .message-content{max-width:400px;padding:20px}
        .message-content h1{font-size:1.25rem;font-weight:600;color:var(--text-color);margin-bottom:8px}
        .message-content p{color:var(--secondary-text-color);font-size:13px;word-break:break-all}
        .spinner{border:2px solid var(--third-bg);border-top-color:var(--primary);border-radius:50%;width:32px;height:32px;animation:spin .8s linear infinite;margin:0 auto 20px}
        @keyframes spin{to{transform:rotate(360deg)}}
        #skip-btn,#retry-btn{margin-top:20px;padding:8px 16px;background:transparent;color:var(--secondary-text-color);border:1px solid var(--third-bg);border-radius:6px;cursor:pointer;font-size:13px;transition:all .15s}
        #skip-btn:hover,#retry-btn:hover{border-color:var(--button-hover);color:var(--text-color)}
    </style>
    <script src="baremux/index.js"></script>
    <script src="scram/scramjet.all.js"></script>
</head>
<body>
    <div id="loading" class="message-container">
        <div class="message-content">
            <div class="spinner"></div>
            <h1 id="loading-title">Connecting</h1>
            <p id="loading-url">Initializing proxy...</p>
            <button id="skip-btn">Skip</button>
        </div>
    </div>
    <div id="error" class="message-container" style="display:none">
        <div class="message-content">
            <h1>Connection Error</h1>
            <p id="error-message">An error occurred.</p>
            <button id="retry-btn">Retry</button>
        </div>
    </div>
    <div id="iframe-container"></div>
    <script>
        // =====================================================
        // STALE INDEXEDDB RECOVERY
        // =====================================================
        // scramjet's own controller can throw "object stores was not found"
        // from inside an IndexedDB onsuccess callback, which bypasses normal
        // try/await/catch and surfaces as an unhandled rejection instead -
        // catch that here and self-heal by clearing the stale database and
        // reloading once, instead of leaving the app permanently broken.
        window.addEventListener("unhandledrejection", async (event) => {
            const msg = event.reason?.message || "";
            if (!msg.includes("object stores") && !msg.includes("IDBDatabase")) return;
            if (sessionStorage.getItem("scramjetIdbRecovered")) return;

            console.warn("scramjet: stale IndexedDB detected, clearing and reloading...", event.reason);
            sessionStorage.setItem("scramjetIdbRecovered", "1");
            event.preventDefault();

            // the service worker holds its own separate open connection to
            // the same database, which would block deleteDatabase from ever
            // actually completing - drop it first so the delete isn't left
            // hanging indefinitely (it re-registers on the next load anyway).
            if ("serviceWorker" in navigator) {
                const regs = await navigator.serviceWorker.getRegistrations();
                await Promise.all(regs.map((r) => r.unregister()));
            }

            await new Promise((resolve) => {
                const req = indexedDB.deleteDatabase("$scramjet");
                req.onsuccess = resolve;
                req.onerror = resolve;
                // in case something else still holds it open, don't hang forever
                setTimeout(resolve, 2000);
            });

            location.reload();
        });

        const WISP_SERVERS = [{ name: "Truffled", url: "wss://truffled.lol/wisp/" }];
        const DEFAULT_WISP = WISP_SERVERS[0].url;

        const ERRORS = {
            noUrl: { title: "No URL Provided", message: "You need to provide a URL to load.", hint: `Format: ${location.pathname}#https://example.com` },
            invalidUrl: { title: "Invalid URL", message: "The URL you provided is not valid.", hint: `Try: ${location.pathname}#https://google.com` },
            connectionFailed: { title: "Connection Failed", message: "Could not connect to the website.", hint: "The site may be down or blocking requests." },
            proxyError: { title: "Proxy Error", message: "Failed to initialize the proxy connection.", hint: "Try refreshing or check your proxy settings." },
            timeout: { title: "Loading Timeout", message: "The page is taking too long to load.", hint: "Click 'Skip' to view what has loaded, or 'Retry' to try again." },
            blocked: { title: "Access Denied", message: "This website is blocking access.", hint: "Some sites don't allow being loaded through proxies." },
            unknown: { title: "Error", message: "An unexpected error occurred.", hint: "Please try again." },
        };

        const els = {
            loading: document.getElementById('loading'),
            loadingTitle: document.getElementById('loading-title'),
            loadingUrl: document.getElementById('loading-url'),
            error: document.getElementById('error'),
            errorMessage: document.getElementById('error-message'),
            iframeContainer: document.getElementById('iframe-container'),
            skipBtn: document.getElementById('skip-btn'),
            retryBtn: document.getElementById('retry-btn'),
        };

        const isValidUrl = (url) => {
            try {
                const u = new URL(url);
                return u.protocol === 'http:' || u.protocol === 'https:';
            } catch {
                return false;
            }
        };

        const showContent = () => {
            els.loading.style.opacity = '0';
            els.loading.style.visibility = 'hidden';
            els.iframeContainer.classList.add('loaded');
        };

        function showError(type, details = '') {
            els.loading.style.display = 'none';
            els.error.style.display = 'flex';
            const err = ERRORS[type] || ERRORS.unknown;
            els.errorMessage.innerHTML = `<strong>${err.title}</strong><br><br>${err.message}<br><br><small style="color:var(--secondary-text-color)">${err.hint}</small>${details ? `<br><br><code style="font-size:11px;background:var(--button-bg);padding:4px 8px;border-radius:4px">${details}</code>` : ''}`;
        }

        function getErrorType(msg) {
            msg = (msg || '').toLowerCase();
            if (msg.includes('fetch') || msg.includes('network')) return 'connectionFailed';
            if (msg.includes('timeout')) return 'timeout';
            if (msg.includes('blocked') || msg.includes('cors') || msg.includes('access')) return 'blocked';
            if (msg.includes('websocket') || msg.includes('wisp')) return 'proxyError';
            return 'unknown';
        }

        // =====================================================
        // PROXY ENGINE - local files, same setup as index.html
        // =====================================================
        let scramjetInstance = null;
        let connectionInstance = null;

        async function initializeScramjet() {
            if (scramjetInstance) return scramjetInstance;

            const { ScramjetController } = $scramjetLoadController();
            scramjetInstance = new ScramjetController({
                // these must be absolute pathnames (not relative paths) -
                // scramjet's own SW-side router does
                // `e.url.startsWith(location.origin + this.config.files.wasm)`
                // to decide whether to serve its rewriter WASM bootstrap, and
                // that check can never match a relative string.
                files: {
                    wasm: new URL("scram/scramjet.wasm.wasm", location.href).pathname,
                    all: new URL("scram/scramjet.all.js", location.href).pathname,
                    sync: new URL("scram/scramjet.sync.js", location.href).pathname,
                },
            });
            await scramjetInstance.init();
            return scramjetInstance;
        }

        async function registerServiceWorker() {
            if (!('serviceWorker' in navigator)) return;
            await navigator.serviceWorker.register('./sw.js');
            await navigator.serviceWorker.ready;
        }

        async function initializeConnection() {
            if (connectionInstance) return connectionInstance;

            const wispUrl = localStorage.getItem("proxServer") || DEFAULT_WISP;
            connectionInstance = new BareMux.BareMuxConnection(new URL("baremux/worker.js", location.href).href);
            await connectionInstance.setTransport(
                new URL("epoxy/index.mjs", location.href).href,
                [{ wisp: wispUrl }],
            );
            return connectionInstance;
        }

        async function initialize() {
            const targetUrl = window.location.hash.substring(1);
            const skipLoading = new URLSearchParams(window.location.search).get('skip') !== null;

            if (!targetUrl) return showError('noUrl');
            if (!isValidUrl(targetUrl)) return showError('invalidUrl', targetUrl);
            if (skipLoading) {
                els.skipBtn.style.display = 'inline-block';
                els.skipBtn.onclick = showContent;
            }

            try {
                // order matters: the service worker must be registered and
                // ready before the BareMux connection is set up, otherwise
                // the transport can end up racing the proxy's own routing.
                await initializeScramjet();
                await registerServiceWorker();
                await initializeConnection();

                els.loadingTitle.textContent = 'Loading Site';
                els.loadingUrl.textContent = targetUrl;

                const activeFrame = scramjetInstance.createFrame();
                activeFrame.frame.id = 'embed-frame';
                els.iframeContainer.appendChild(activeFrame.frame);
                activeFrame.frame.addEventListener('load', () => {
                    showContent();
                    // this is the innermost frame actually holding the proxied
                    // page - an outer page focusing *its* iframe doesn't cascade
                    // down to this one, so keyboard input (arrow keys, WASD,
                    // etc. - critical for something like cloud gaming) never
                    // reaches the destination unless this frame is focused too.
                    activeFrame.frame.focus();
                });
                els.iframeContainer.addEventListener('click', () => activeFrame.frame.focus());

                setTimeout(() => {
                    els.skipBtn.style.display = 'inline-block';
                    els.skipBtn.onclick = showContent;
                }, 2000);

                activeFrame.go(targetUrl);
            } catch (err) {
                console.error('embed: initialization error:', err);
                showError(getErrorType(err.message), targetUrl);
            }
        }

        els.retryBtn.onclick = () => location.reload();

        window.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>
</html>
