<!DOCTYPE html>
<html lang="en">

<head>
   <meta property="og:title" content="Classroom Management Tools & Resources - Google for Education">
   <meta property="og:description" content="Google Classroom is your central place where teaching and learning come together. This easy-to-use and secure tool helps educators manage, measure and enrich learning experiences.">
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>home</title>

   <link rel="icon" href="/storage/images/googleclassroom.png" type="image/png">
   <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
   <link href="/storage/css/iframe.css" rel="stylesheet">
   <link href="/storage/css/cursor.css" rel="stylesheet">

   <script src="/storage/js/cursor.js"></script>
</head>

<body>

   <main class="frame-page">
      <section class="game-panel">
         <div class="game-shell">
            <iframe id="game-frame" class="game-iframe" allowfullscreen tabindex="0"></iframe>
         </div>

         <div class="frame-controls">
            <button id="reload-button" type="button" aria-label="reload">
               <i class="fa-solid fa-rotate-right"></i>
            </button>

            <button id="fullscreen-button" type="button" aria-label="fullscreen">
               <i class="fa-solid fa-expand"></i>
            </button>

            <button id="blank-button" type="button" aria-label="about blank">
               <i class="fa-solid fa-up-right-from-square"></i>
            </button>

            <button id="downloads-button" type="button" aria-label="downloads">
               <i class="fa-solid fa-file-arrow-down"></i>
            </button>
         </div>
      </section>
   </main>

   <script>
      // scramjet's own controller (running inside the embedded frame) can
      // throw "object stores was not found" from inside an IndexedDB
      // onsuccess callback, which bypasses normal try/await/catch and
      // surfaces as an unhandled rejection here at the top level instead -
      // catch that and self-heal by clearing the stale database and
      // reloading once, instead of leaving the page permanently broken.
      window.addEventListener("unhandledrejection", async (event) => {
         const msg = event.reason?.message || "";
         if (!msg.includes("object stores") && !msg.includes("IDBDatabase")) return;
         if (sessionStorage.getItem("scramjetIdbRecovered")) return;

         console.warn("scramjet: stale IndexedDB detected, clearing and reloading...", event.reason);
         sessionStorage.setItem("scramjetIdbRecovered", "1");
         event.preventDefault();

         if ("serviceWorker" in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => r.unregister()));
         }

         await new Promise((resolve) => {
            const req = indexedDB.deleteDatabase("$scramjet");
            req.onsuccess = resolve;
            req.onerror = resolve;
            setTimeout(resolve, 2000);
         });

         location.reload();
      });

      const gameFrame = document.getElementById("game-frame");
      const reloadButton = document.getElementById("reload-button");
      const fullscreenButton = document.getElementById("fullscreen-button");
      const blankButton = document.getElementById("blank-button");
      const downloadsButton = document.getElementById("downloads-button");

      function getUrlParameter(name) {
         const params = new URLSearchParams(window.location.search);
         return params.get(name);
      }

      function decodeParam(value) {
         let decoded = String(value || "").trim();

         for (let i = 0; i < 2; i++) {
            try {
               const next = decodeURIComponent(decoded);
               if (next === decoded) break;
               decoded = next;
            } catch (error) {
               break;
            }
         }

         return decoded;
      }

      function hasProtocol(value) {
         return /^https?:\/\//i.test(value);
      }

      function makeFullUrl(value) {
         const decoded = decodeParam(value);

         if (!decoded) {
            return "";
         }

         if (hasProtocol(decoded)) {
            return decoded;
         }

         if (decoded.startsWith("//")) {
            return "https:" + decoded;
         }

         if (decoded.includes(".") && !decoded.includes(" ")) {
            return "https://" + decoded;
         }

         return "https://duckduckgo.com/?q=" + encodeURIComponent(decoded) + "&kp=1&ia=web";
      }

      function setFrameUrl() {
         const proxyUrl = getUrlParameter("p") || getUrlParameter("url");

         if (!proxyUrl) {
            gameFrame.src = "/404";
            return;
         }

         const finalUrl = makeFullUrl(proxyUrl);

         if (!finalUrl) {
            gameFrame.src = "/404";
            return;
         }

         gameFrame.src = "/scramjet/embed.html#" + finalUrl;
      }

      function reloadFrame() {
         // reassigning to the same value is a no-op in most browsers - force
         // an actual reload by clearing it first.
         const current = gameFrame.src;
         gameFrame.src = "about:blank";
         gameFrame.src = current;
      }

      function fullscreenFrame() {
         if (!document.fullscreenElement) {
            gameFrame.requestFullscreen().catch(function () {});
         } else {
            document.exitFullscreen();
         }
      }

      function openInAboutBlank() {
         const siteTitle = localStorage.getItem("siteTitle") || "home";
         const siteLogo = localStorage.getItem("siteLogo") || "/storage/images/googleclassroom.png";
         const tab = window.open("about:blank", "_blank");

         if (!tab) {
            return;
         }

         tab.document.title = siteTitle;

         const icon = tab.document.createElement("link");
         icon.rel = "icon";
         icon.href = siteLogo;
         tab.document.head.appendChild(icon);

         const style = tab.document.createElement("style");
         style.textContent = `
            html,
            body {
               width: 100%;
               height: 100%;
               margin: 0;
               overflow: hidden;
               background: black;
            }

            iframe {
               width: 100vw;
               height: 100vh;
               border: 0;
               display: block;
            }
         `;

         tab.document.head.appendChild(style);

         const frame = tab.document.createElement("iframe");
         frame.src = gameFrame.src;
         tab.document.body.appendChild(frame);
      }

      function makeSafeFileName(url) {
         const parsed = new URL(url, window.location.href);
         const parts = parsed.pathname.split("/").filter(Boolean);
         const lastPart = parts[parts.length - 1] || "iframe";

         return lastPart
            .replace(".html", "")
            .replace("index", parts[parts.length - 2] || "iframe")
            .replace(/[^a-z0-9-_]/gi, "-")
            .toLowerCase();
      }

      function downloadIframePage(frameElement, fallbackName) {
         const rawUrl = frameElement.getAttribute("src") || frameElement.src;

         if (!rawUrl) {
            return;
         }

         const fullUrl = new URL(rawUrl, window.location.origin).href;
         const fileName = makeSafeFileName(fullUrl) || fallbackName || "iframe";

         const html = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${fileName}</title>
<style>
html,
body {
   width: 100%;
   height: 100%;
   margin: 0;
   padding: 0;
   overflow: hidden;
   background: #000;
}

iframe {
   width: 100vw;
   height: 100vh;
   border: 0;
   display: block;
   overflow: hidden;
}
</style>
</head>
<body>
<iframe src="${fullUrl}" allowfullscreen></iframe>
</body>
</html>`;

         const blob = new Blob([html], {
            type: "text/html"
         });

         const link = document.createElement("a");

         link.href = URL.createObjectURL(blob);
         link.download = fileName + ".html";

         document.body.appendChild(link);
         link.click();
         link.remove();

         URL.revokeObjectURL(link.href);
      }

      function openDownloads() {
         downloadIframePage(gameFrame, "proxy");
      }

      gameFrame.addEventListener("load", function () {
         gameFrame.focus();
      });

      gameFrame.addEventListener("click", function () {
         gameFrame.focus();
      });

      // pressing Escape while fullscreen forces the browser to exit it (no
      // site can override that), which knocks focus off the iframe with
      // nothing to bring it back - without this, keyboard input silently
      // stops working the moment fullscreen is exited via Escape.
      document.addEventListener("fullscreenchange", function () {
         if (!document.fullscreenElement) {
            gameFrame.focus();
         }
      });

      reloadButton.addEventListener("click", reloadFrame);
      fullscreenButton.addEventListener("click", fullscreenFrame);
      blankButton.addEventListener("click", openInAboutBlank);
      downloadsButton.addEventListener("click", openDownloads);

      window.addEventListener("DOMContentLoaded", setFrameUrl);
   </script>

   <script src="/storage/js/settings.js"></script>
   <script id="cursor-state-fix-js" src="/storage/js/cursor-state-fix.js"></script>
</body>

</html>
