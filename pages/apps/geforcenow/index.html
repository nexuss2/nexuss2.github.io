<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GeForce NOW Unavailable</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0c0c0c;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      width: 90%;
      max-width: 520px;
      padding: 40px;
      text-align: center;
      background: #151515;
      border: 1px solid #292929;
      border-radius: 18px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.45);
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #252525;
      font-size: 30px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 26px;
    }

    p {
      margin: 0 0 25px;
      color: #aaa;
      line-height: 1.6;
    }

    .alternative {
      padding: 20px;
      background: #1d1d1d;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .alternative h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .alternative p {
      margin: 0 0 15px;
      font-size: 14px;
    }

    .button {
      display: inline-block;
      padding: 12px 22px;
      border: 0;
      border-radius: 9px;
      background: #fff;
      color: #111;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .button:hover {
      opacity: 0.9;
    }

    .status {
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icon">⚠</div>

    <h1>GeForce NOW isn't working</h1>

    <p>
      GeForce NOW is currently unavailable or isn't working properly.
      Please try again later.
    </p>

    <div class="alternative">

      <h2>Try Figure Cloud instead</h2>

      <p>
        You can use Figure Cloud as an alternative while GeForce NOW
        is unavailable.
      </p>

      <button class="button" id="figureButton">
        Open Figure Cloud
      </button>

    </div>

    <div class="status">
      GeForce NOW should be available again once the issue is resolved.
    </div>

  </div>

  <script>
    document.getElementById("figureButton").addEventListener("click", function () {

      const figureCloud =
        "/pages/pframe.html?url=https://figurestand.workerlo.workers.dev/";

      /*
       * Structure:
       *
       * Main page
       *   └── /pages/iframe.html
       *        └── /pages/apps/geforcenow/
       *
       * Replace the OUTER iframe, not the inner one.
       */

      if (window.parent && window.parent.frameElement) {
        window.parent.frameElement.src = figureCloud;
      }

    });
  </script>

</body>
</html>
